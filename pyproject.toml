[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analytics-ai"
version = "0.2.5"
description = "AI-powered portfolio analytics and optimization tools"
authors = [
    {name = "Shamit Verma", email = "oss@shamit.in"},
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "yfinance>=1.5.2",
    "plotly>=6.9.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "openpyxl>=3.1.5",
    "pandas_market_calendars>=5.4.0",
    "openai>=2.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "jupyter>=1.1.1",
    "build>=1.5.0",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/shamitv/PortfolioAnalyticsAI"
Repository = "https://github.com/shamitv/PortfolioAnalyticsAI"
Issues = "https://github.com/shamitv/PortfolioAnalyticsAI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
